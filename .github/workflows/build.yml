name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  # SDK 2023-09-23 - последний официальный SDK эпохи foobar2000 v2.0.
  # Компоненты, собранные с ним, работают и на v2.1 / v2.2x.
  SDK_VERSION: SDK-2023-09-23

jobs:
  build:
    name: Release | ${{ matrix.architecture }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            architecture: x64
          - platform: Win32
            architecture: x86

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download foobar2000 SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $archive = Join-Path $env:RUNNER_TEMP 'sdk.archive'
          $extractDir = Join-Path $env:RUNNER_TEMP 'sdk-extracted'
          $officialUrl = "https://www.foobar2000.org/downloads/$env:SDK_VERSION.7z"
          $usedMirror = $false

          Write-Host "Downloading $officialUrl"
          try {
            Invoke-WebRequest -Uri $officialUrl -OutFile $archive -UseBasicParsing
          }
          catch {
            Write-Warning "Official download failed: $($_.Exception.Message)"
            Write-Warning "Falling back to the untouched GitHub mirror of the same SDK release."
            $mirrorUrl = "https://codeload.github.com/reupen/foobar2000-sdk-unmodified/tar.gz/refs/tags/$env:SDK_VERSION"
            Invoke-WebRequest -Uri $mirrorUrl -OutFile $archive -UseBasicParsing
            $usedMirror = $true
          }

          if (Test-Path $extractDir) { Remove-Item $extractDir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $extractDir | Out-Null

          if ($usedMirror) {
            tar -xzf $archive -C $extractDir
            if ($LASTEXITCODE -ne 0) { throw "tar failed with exit code $LASTEXITCODE" }
          }
          else {
            $sevenZip = Join-Path $env:ProgramFiles '7-Zip\7z.exe'
            if (-not (Test-Path $sevenZip)) {
              $sevenZip = (Get-Command 7z -ErrorAction SilentlyContinue).Source
            }
            if (-not $sevenZip) {
              choco install 7zip -y --no-progress | Out-Null
              $sevenZip = Join-Path $env:ProgramFiles '7-Zip\7z.exe'
            }
            if (-not (Test-Path $sevenZip)) { throw '7-Zip is not available on the runner.' }

            & $sevenZip x $archive "-o$extractDir" -y | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "7-Zip failed with exit code $LASTEXITCODE" }
          }

          # Официальный архив может распаковаться как сразу в корень, так и в подпапку -
          # ищем каталог, в котором лежит foobar2000\SDK\foobar2000.h.
          $candidates = @(Get-Item $extractDir) + @(Get-ChildItem $extractDir -Directory -Recurse)
          $sdkRoot = $candidates |
            Where-Object { Test-Path (Join-Path $_.FullName 'foobar2000\SDK\foobar2000.h') } |
            Select-Object -First 1

          if (-not $sdkRoot) { throw 'Could not locate the foobar2000 SDK root after extraction.' }

          Write-Host "SDK root: $($sdkRoot.FullName)"
          New-Item -ItemType Directory -Force -Path sdk | Out-Null
          Copy-Item -Path (Join-Path $sdkRoot.FullName '*') -Destination sdk -Recurse -Force

          if (-not (Test-Path 'sdk\foobar2000\SDK\foobar2000.h')) { throw 'SDK was not copied correctly.' }
          Get-ChildItem sdk | Select-Object -ExpandProperty Name

          $source = if ($usedMirror) { 'GitHub mirror (official download failed)' } else { 'foobar2000.org (official)' }
          Write-Host "::notice title=SDKSource::$env:SDK_VERSION from $source"

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $arguments = @(
            'foo_mouse_gesture_host.sln', '/m', '/nologo', '/v:m',
            '/p:Configuration=Release', '/p:Platform=${{ matrix.platform }}',
            '/flp:LogFile=build.log;Verbosity=normal;Encoding=UTF-8'
          )
          msbuild @arguments
          if ($LASTEXITCODE -ne 0) { throw "MSBuild failed with exit code $LASTEXITCODE" }

      - name: Report build errors
        if: failure()
        shell: pwsh
        run: |
          if (-not (Test-Path build.log)) {
            Write-Host '::error title=MSBuild::build.log was not produced'
            exit 0
          }

          $errors = Select-String -Path build.log -Pattern ': error [A-Z]{1,4}[0-9]{3,5}|error MSB[0-9]{4}' |
            Select-Object -First 10
          foreach ($entry in $errors) {
            Write-Host "::error title=MSBuild::$($entry.Line.Trim())"
          }

          if (-not $errors) {
            Get-Content build.log -Tail 20 | ForEach-Object { Write-Host "::error title=MSBuild tail::$_" }
          }

      - name: Upload MSBuild log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msbuild-log-${{ github.run_number }}-${{ matrix.architecture }}
          path: build.log
          if-no-files-found: ignore

      - name: Package .fb2k-component
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $version = if ($env:GITHUB_REF -like 'refs/tags/*') {
            $env:GITHUB_REF -replace '^refs/tags/', ''
          } else {
            'dev'
          }

          $platform = '${{ matrix.platform }}'
          $architecture = '${{ matrix.architecture }}'
          $dll = Get-Item "build\$platform\Release\foo_mouse_gesture_host.dll" -ErrorAction Stop
          if ($dll.Length -lt 20000) {
            throw "Built DLL looks wrong: $($dll.Length) bytes"
          }

          # IMAGE_FILE_MACHINE_I386 = 0x014c, IMAGE_FILE_MACHINE_AMD64 = 0x8664.
          $image = [System.IO.File]::ReadAllBytes($dll.FullName)
          $peOffset = [BitConverter]::ToInt32($image, 0x3C)
          $machine = [BitConverter]::ToUInt16($image, $peOffset + 4)
          $expectedMachine = if ($architecture -eq 'x86') { 0x14C } else { 0x8664 }
          if ($machine -ne $expectedMachine) {
            throw ("Unexpected DLL architecture: 0x{0:X4}; expected 0x{1:X4}" -f $machine, $expectedMachine)
          }
          Write-Host "DLL: $($dll.FullName) ($($dll.Length) bytes), machine 0x$($machine.ToString('X4'))"

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $package = "dist\foo_mouse_gesture_host-$version-$architecture.fb2k-component"
          Compress-Archive -Path $dll.FullName -DestinationPath $package -Force

          Get-Item $package | Select-Object FullName, Length

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: foo_mouse_gesture_host-${{ github.run_number }}-${{ matrix.architecture }}
          path: dist/*.fb2k-component
          if-no-files-found: error

  release:
    name: Create GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest

    steps:
      - name: Download component packages
        uses: actions/download-artifact@v4
        with:
          pattern: foo_mouse_gesture_host-${{ github.run_number }}-*
          path: dist
          merge-multiple: true

      - name: Publish both architectures
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'

          $tag = $env:GITHUB_REF -replace '^refs/tags/', ''
          $packages = @(
            Get-ChildItem 'dist' -Filter '*.fb2k-component' -Recurse |
              Sort-Object Name |
              ForEach-Object { $_.FullName }
          )
          if ($packages.Count -ne 2) {
            throw "Expected x64 and x86 component packages, found $($packages.Count)"
          }

          gh release create $tag $packages `
            --title "Mouse Gesture Host $tag" `
            --generate-notes `
            --verify-tag

          if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit code $LASTEXITCODE" }
