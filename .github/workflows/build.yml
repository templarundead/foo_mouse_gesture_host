name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # SDK 2023-09-23 - последний официальный SDK эпохи foobar2000 v2.0.
  # Компоненты, собранные с ним, работают и на v2.1 / v2.2x.
  SDK_VERSION: SDK-2023-09-23

jobs:
  build:
    name: Release | ${{ matrix.architecture }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            architecture: x64
          - platform: Win32
            architecture: x86

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download foobar2000 SDK
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File tools\fetch-sdk.ps1 -Destination sdk

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

      - name: Build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $arguments = @(
            'foo_mouse_gesture_host.sln', '/m', '/nologo', '/v:m',
            '/p:Configuration=Release', '/p:Platform=${{ matrix.platform }}',
            '/flp:LogFile=build.log;Verbosity=normal;Encoding=UTF-8'
          )
          msbuild @arguments
          if ($LASTEXITCODE -ne 0) { throw "MSBuild failed with exit code $LASTEXITCODE" }

      - name: Report build errors
        if: failure()
        shell: pwsh
        run: |
          if (-not (Test-Path build.log)) {
            Write-Host '::error title=MSBuild::build.log was not produced'
            exit 0
          }

          $errors = Select-String -Path build.log -Pattern ': error [A-Z]{1,4}[0-9]{3,5}|error MSB[0-9]{4}' |
            Select-Object -First 10
          foreach ($entry in $errors) {
            Write-Host "::error title=MSBuild::$($entry.Line.Trim())"
          }

          if (-not $errors) {
            Get-Content build.log -Tail 20 | ForEach-Object { Write-Host "::error title=MSBuild tail::$_" }
          }

      - name: Upload MSBuild log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: msbuild-log-${{ github.run_number }}-${{ matrix.architecture }}
          path: build.log
          if-no-files-found: ignore

      - name: Package .fb2k-component
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $versionHeader = Get-Content 'src\component_version.h' -Raw
          $versionMatch = [regex]::Match($versionHeader, '(?m)^#define\s+MGH_COMPONENT_VERSION\s+"([0-9]+\.[0-9]+\.[0-9]+)"\s*$')
          if (-not $versionMatch.Success) { throw 'Could not read MGH_COMPONENT_VERSION.' }
          $sourceVersion = $versionMatch.Groups[1].Value

          $version = "$sourceVersion-dev$env:GITHUB_RUN_NUMBER"
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $tag = $env:GITHUB_REF -replace '^refs/tags/', ''
            if ($tag -ne "v$sourceVersion") {
              throw "Tag $tag does not match source version v$sourceVersion"
            }
            $version = $tag
          }

          $platform = '${{ matrix.platform }}'
          $architecture = '${{ matrix.architecture }}'
          $dll = Get-Item "build\$platform\Release\foo_mouse_gesture_host.dll" -ErrorAction Stop
          if ($dll.Length -lt 20000) {
            throw "Built DLL looks wrong: $($dll.Length) bytes"
          }

          # IMAGE_FILE_MACHINE_I386 = 0x014c, IMAGE_FILE_MACHINE_AMD64 = 0x8664.
          $image = [System.IO.File]::ReadAllBytes($dll.FullName)
          $peOffset = [BitConverter]::ToInt32($image, 0x3C)
          $machine = [BitConverter]::ToUInt16($image, $peOffset + 4)
          $expectedMachine = if ($architecture -eq 'x86') { 0x14C } else { 0x8664 }
          if ($machine -ne $expectedMachine) {
            throw ("Unexpected DLL architecture: 0x{0:X4}; expected 0x{1:X4}" -f $machine, $expectedMachine)
          }
          Write-Host "DLL: $($dll.FullName) ($($dll.Length) bytes), machine 0x$($machine.ToString('X4'))"

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $package = "dist\foo_mouse_gesture_host-$version-$architecture.fb2k-component"
          Compress-Archive -Path $dll.FullName -DestinationPath $package -Force

          Get-Item $package | Select-Object FullName, Length

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: foo_mouse_gesture_host-${{ github.run_number }}-${{ matrix.architecture }}
          path: dist/*.fb2k-component
          if-no-files-found: error

  logic-tests:
    name: Logic tests | ${{ matrix.architecture }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            architecture: x64
          - platform: Win32
            architecture: x86

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

      - name: Build portable logic tests
        shell: pwsh
        run: |
          msbuild tests\logic_tests.vcxproj /m /nologo /v:m `
            /p:Configuration=Release /p:Platform=${{ matrix.platform }}
          if ($LASTEXITCODE -ne 0) { throw "Logic test build failed with exit code $LASTEXITCODE" }

      - name: Run portable logic tests
        shell: pwsh
        run: |
          & "build\logic-tests\${{ matrix.platform }}\Release\logic_tests.exe" --benchmark
          if ($LASTEXITCODE -ne 0) { throw "Logic tests failed with exit code $LASTEXITCODE" }

  release:
    name: Create GitHub release
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, logic-tests]
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download component packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: foo_mouse_gesture_host-${{ github.run_number }}-*
          path: dist
          merge-multiple: true

      - name: Publish both architectures
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'

          $tag = $env:GITHUB_REF -replace '^refs/tags/', ''
          $versionHeader = Get-Content 'src\component_version.h' -Raw
          $versionMatch = [regex]::Match($versionHeader, '(?m)^#define\s+MGH_COMPONENT_VERSION\s+"([0-9]+\.[0-9]+\.[0-9]+)"\s*$')
          if (-not $versionMatch.Success) { throw 'Could not read MGH_COMPONENT_VERSION.' }
          if ($tag -ne "v$($versionMatch.Groups[1].Value)") {
            throw "Tag $tag does not match source version v$($versionMatch.Groups[1].Value)"
          }

          $expected = @(
            "foo_mouse_gesture_host-$tag-x64.fb2k-component",
            "foo_mouse_gesture_host-$tag-x86.fb2k-component"
          ) | Sort-Object
          $packages = @(
            Get-ChildItem 'dist' -Filter '*.fb2k-component' -File -Recurse |
              Sort-Object Name |
              ForEach-Object { $_.FullName }
          )
          $actual = @($packages | ForEach-Object { [System.IO.Path]::GetFileName($_) } | Sort-Object)
          if ($packages.Count -ne 2 -or (Compare-Object $expected $actual)) {
            throw "Expected exactly $expected; found $actual"
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          foreach ($package in $packages) {
            $name = [System.IO.Path]::GetFileName($package)
            $architecture = if ($name.EndsWith('-x86.fb2k-component')) { 'x86' } else { 'x64' }
            $expectedMachine = if ($architecture -eq 'x86') { 0x14C } else { 0x8664 }

            $zip = [System.IO.Compression.ZipFile]::OpenRead($package)
            try {
              if ($zip.Entries.Count -ne 1 -or $zip.Entries[0].FullName -ne 'foo_mouse_gesture_host.dll') {
                throw "Unexpected contents in $name"
              }
              $stream = $zip.Entries[0].Open()
              $memory = New-Object System.IO.MemoryStream
              try {
                $stream.CopyTo($memory)
                $image = $memory.ToArray()
              }
              finally {
                $memory.Dispose()
                $stream.Dispose()
              }
            }
            finally {
              $zip.Dispose()
            }

            $peOffset = [BitConverter]::ToInt32($image, 0x3C)
            $machine = [BitConverter]::ToUInt16($image, $peOffset + 4)
            if ($machine -ne $expectedMachine) {
              throw ("Unexpected machine in ${name}: 0x{0:X4}; expected 0x{1:X4}" -f $machine, $expectedMachine)
            }
          }

          $checksums = Join-Path $PWD 'SHA256SUMS.txt'
          $lines = @($packages | ForEach-Object {
            $hash = (Get-FileHash $_ -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([System.IO.Path]::GetFileName($_))"
          })
          [System.IO.File]::WriteAllLines($checksums, $lines, [System.Text.UTF8Encoding]::new($false))
          $assets = @($packages) + @($checksums)

          gh release create $tag $assets `
            --title "Mouse Gesture Host $tag" `
            --generate-notes `
            --verify-tag

          if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit code $LASTEXITCODE" }
